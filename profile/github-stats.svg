<svg width="520" height="190" viewBox="0 0 520 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Elias's GitHub stats</title>
  <desc id="desc">GitHub statistics for @eliasecasta using private + public owned repositories</desc>
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }
    .handle { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #a9b1d6; }
    .label { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
    .value { font: 700 22px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff; }
    .note { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #787c99; }
  </style>
  <rect x="0.5" y="0.5" width="519" height="189" rx="6" fill="#1a1b27" stroke="#30363d"/>
  <text class="title" x="24" y="34">Elias's GitHub Stats</text>
  <text class="handle" x="24" y="54">@eliasecasta · private + public owned repositories</text>
  
    <g transform="translate(24, 92)">
      <text class="label" x="0" y="0">Repositories</text>
      <text class="value" x="0" y="28">87</text>
    </g>
  
    <g transform="translate(154, 92)">
      <text class="label" x="0" y="0">Private repos</text>
      <text class="value" x="0" y="28">37</text>
    </g>
  
    <g transform="translate(284, 92)">
      <text class="label" x="0" y="0">Stars earned</text>
      <text class="value" x="0" y="28">148</text>
    </g>
  
    <g transform="translate(414, 92)">
      <text class="label" x="0" y="0">Followers</text>
      <text class="value" x="0" y="28">104</text>
    </g>
  <text class="note" x="24" y="164">Private repository names and contents are never rendered in this card.</text>
</svg>
