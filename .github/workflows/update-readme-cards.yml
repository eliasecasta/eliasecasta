name: Update README visuals

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/update-readme-cards.yml"
      - "scripts/generate-profile-stats.py"

permissions:
  contents: write

concurrency:
  group: profile-readme-visuals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate private-aware profile cards
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python3 scripts/generate-profile-stats.py

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_STATS_TOKEN }}
          outputs: |
            profile/contribution-snake.svg?palette=github-light&color_snake=#3b82f6
            profile/contribution-snake-dark.svg?palette=github-dark&color_snake=#70a5fd&color_dots=#161b22,#283457,#3d59a1,#7aa2f7,#bb9af7

      - name: Commit updated visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            profile/github-stats.svg \
            profile/top-langs.svg \
            profile/contribution-snake.svg \
            profile/contribution-snake-dark.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update README visuals"
          git pull --rebase origin master
          git push
